name: Build the docs

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build documentation
        uses: elastic/docs-builder@main

      - name: Overwrite index with custom landing page
        run: cp docs/cli-schema-landing.html .artifacts/docs/html/index.html

      - name: Copy robots.txt
        run: cp docs/robots.txt .artifacts/docs/html/robots.txt

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .artifacts/docs/html --project-name=cli-schema
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
